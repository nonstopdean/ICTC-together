<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b2026" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ICTC 함께">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ICTC 함께 · 지휘역량강화센터 일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   색과 글꼴
   ========================================================= */
:root{
  --ink:#1c2228; --ink2:#46515c; --muted:#76818c; --line:#dfe3e7; --line2:#eceff2;
  --bg:#f1f3f5; --card:#ffffff; --soft:#f7f8f9;
  --fire:#c8102e; --fire-soft:#fbe9ec;
  --edu:#1f5aa6;   --edu-bg:#e2ebf7;
  --eval:#6a3d9f;  --eval-bg:#ece4f6;
  --trip:#a86400;  --trip-bg:#fbeed6;
  --leave:#1f7a4a; --leave-bg:#dff1e6;
  --etc:#4d5b69;   --etc-bg:#e6e9ed;
  --sun:#c8102e; --sat:#2563b0;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 20px rgba(20,30,40,.06);
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e8ecef; --ink2:#b9c2ca; --muted:#8b96a1; --line:#2f3740; --line2:#262d34;
    --bg:#14181c; --card:#1b2026; --soft:#20262d;
    --fire:#ff5a6e; --fire-soft:#3a1d23;
    --edu:#7fb0f0; --edu-bg:#1c2f47; --eval:#c4a3ee; --eval-bg:#2e2443;
    --trip:#f0b357; --trip-bg:#3b2c14; --leave:#6fd19a; --leave-bg:#173426;
    --etc:#a9b5c1; --etc-bg:#2a323a; --sun:#ff6b7d; --sat:#7fb0f0;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e8ecef; --ink2:#b9c2ca; --muted:#8b96a1; --line:#2f3740; --line2:#262d34;
  --bg:#14181c; --card:#1b2026; --soft:#20262d;
  --fire:#ff5a6e; --fire-soft:#3a1d23;
  --edu:#7fb0f0; --edu-bg:#1c2f47; --eval:#c4a3ee; --eval-bg:#2e2443;
  --trip:#f0b357; --trip-bg:#3b2c14; --leave:#6fd19a; --leave-bg:#173426;
  --etc:#a9b5c1; --etc-bg:#2a323a; --sun:#ff6b7d; --sat:#7fb0f0;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body.locked{overflow:hidden}
:focus-visible{outline:2px solid var(--edu);outline-offset:2px}
.hide{display:none!important}

/* ---------- 머리 ---------- */
.top{background:var(--card);border-top:4px solid var(--fire);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:baseline;gap:8px;min-width:0}
.mark b{font-size:19px;font-weight:700;letter-spacing:-.4px;white-space:nowrap}
.mark b em{font-style:normal;color:var(--fire)}
.mark span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-size:12px;font-weight:700}
.btn{border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;background:var(--soft);color:var(--ink);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-ink{background:var(--ink);color:var(--card)}
.btn-fire{background:var(--fire);color:#fff}
.btn-line{background:var(--card);border-color:var(--line)}
.btn-danger{background:var(--card);border-color:var(--line);color:var(--fire)}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}

.wrap{max-width:1120px;margin:0 auto;padding:14px 16px 110px}
.banner{font-size:13px;border-radius:10px;padding:9px 12px;margin-bottom:12px;background:var(--trip-bg);color:var(--trip)}
.banner b{font-weight:700}

/* ---------- 오늘 상황판 ---------- */
.board{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;overflow:hidden;margin-bottom:14px}
.board-date{background:var(--ink);color:var(--card);padding:14px 18px;display:flex;flex-direction:column;justify-content:center;min-width:104px}
.board-date small{font-size:12px;opacity:.75}
.board-date strong{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.board-date span{font-size:13px;opacity:.9}
.board-body{padding:12px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.board-row{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.board-row > b{flex:0 0 auto;font-size:12px;color:var(--muted);font-weight:600;padding-top:3px;width:42px}
.board-row .val{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 8px;font-size:13px;font-weight:600;border:0;max-width:100%}
.tag i{font-style:normal;font-weight:500;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-edu{background:var(--edu-bg);color:var(--edu)} .t-eval{background:var(--eval-bg);color:var(--eval)}
.t-trip{background:var(--trip-bg);color:var(--trip)} .t-leave{background:var(--leave-bg);color:var(--leave)}
.t-etc{background:var(--etc-bg);color:var(--etc)}
.none{color:var(--muted);font-size:13.5px;padding-top:2px}

/* ---------- 보기 전환, 필터 ---------- */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.35}
.chip[aria-pressed="true"]::before{opacity:1}
.chip[data-c="edu"][aria-pressed="true"],.chip[data-c="eval"][aria-pressed="true"]{color:var(--ink);border-color:currentColor}
.chip[data-c="trip"][aria-pressed="true"]{color:var(--trip);border-color:currentColor}
.chip[data-c="leave"][aria-pressed="true"]{color:var(--leave);border-color:currentColor}
.chip[data-c="etc"][aria-pressed="true"]{color:var(--etc);border-color:currentColor}

/* ---------- 월간 ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.phead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.phead h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.nav{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1;display:grid;place-items:center}
.phead .right{margin-left:auto;display:flex;gap:6px}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line2)}
.dow div:first-child{color:var(--sun)} .dow div:last-child{color:var(--sat)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:26px repeat(3,21px) 18px;row-gap:2px;position:relative;border-bottom:1px solid var(--line2);min-height:104px}
.week:last-child{border-bottom:0}
.cell{grid-row:1/-1;border:0;border-right:1px solid var(--line2);background:transparent;padding:0;text-align:left;position:relative;z-index:0}
.cell:last-of-type{border-right:0}
.cell.out{background:var(--soft)}
.cell.out .dn{opacity:.45}
.cell.sel{background:var(--edu-bg)}
.dn{position:absolute;top:4px;left:6px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px;max-width:calc(100% - 40px);white-space:nowrap;overflow:hidden}
.dn em{font-style:normal;font-size:10px;font-weight:500;color:var(--sun);overflow:hidden;text-overflow:ellipsis}
.cell.sun .dn,.cell.hol .dn{color:var(--sun)} .cell.sat .dn{color:var(--sat)}
.cell.today .dn b{background:var(--fire);color:#fff;border-radius:999px;padding:0 6px;font-weight:700}
.ev{z-index:1;margin:0 2px;border:0;border-radius:4px;font-size:11.5px;font-weight:600;line-height:21px;height:21px;padding:0 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev.cont-l{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.ev.cont-r{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.ev.edu{background:var(--edu-bg);color:var(--edu);box-shadow:inset 3px 0 0 var(--edu)}
.ev.eval{background:var(--eval-bg);color:var(--eval);box-shadow:inset 3px 0 0 var(--eval)}
.ev.trip{background:var(--trip-bg);color:var(--trip);box-shadow:inset 3px 0 0 var(--trip)}
.ev.leave{background:var(--leave-bg);color:var(--leave);box-shadow:inset 3px 0 0 var(--leave)}
.ev.etc{background:var(--etc-bg);color:var(--etc);box-shadow:inset 3px 0 0 var(--etc)}
.ev.cont-l{box-shadow:none}
.ev.plan{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(127,127,127,.12) 6px 9px)}
.more{z-index:1;font-size:11px;color:var(--muted);padding-left:6px;align-self:center;pointer-events:none;font-weight:600}

/* ---------- 선택한 날 ---------- */
.day-head{padding:14px 16px 4px}
.day-head h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.3px}
.day-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.items{padding:8px 12px 14px;display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:9px 10px 9px 0;text-align:left;width:100%;overflow:hidden}
.item .stripe{align-self:stretch;border-radius:0 3px 3px 0}
.item .t{display:block;font-weight:600;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.item .m{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.item .badge{font-size:11px;font-weight:700;border-radius:5px;padding:2px 6px;white-space:nowrap}
.s-edu{background:var(--edu)} .s-eval{background:var(--eval)} .s-trip{background:var(--trip)} .s-leave{background:var(--leave)} .s-etc{background:var(--etc)}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:13.5px}
.empty .btn{margin-top:10px}

/* ---------- 연간 ---------- */
.year{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:14px}
.mini{border:1px solid var(--line2);border-radius:12px;padding:10px;background:var(--card)}
.mini h4{margin:0 0 6px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.mini h4 small{font-size:11px;color:var(--muted);font-weight:500}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mgrid .h{font-size:10px;text-align:center;color:var(--muted)}
.md{border:0;background:transparent;height:28px;border-radius:5px;font-size:11px;font-variant-numeric:tabular-nums;position:relative;padding:0;font-weight:500;color:var(--ink2)}
.md.edu{background:var(--edu-bg);color:var(--edu);font-weight:700}
.md.eval{background:var(--eval-bg);color:var(--eval);font-weight:700}
.md.hol,.md.sun{color:var(--sun)}
.md.today{outline:2px solid var(--fire);outline-offset:-2px}
.md .dots{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.md .dots i{width:4px;height:4px;border-radius:50%}
.md .dots .trip{background:var(--trip)} .md .dots .leave{background:var(--leave)} .md .dots .etc{background:var(--etc)}
.mlist{margin:8px 0 0;padding:0;list-style:none;font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:3px}
.mlist li{display:grid;grid-template-columns:44px 1fr;gap:6px}
.mlist li span{color:var(--muted);font-variant-numeric:tabular-nums}
.mlist li.plan b::after{content:" (안)";color:var(--muted);font-weight:500}
.mlist b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 목록 ---------- */
.listtools{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.search{flex:1 1 200px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card)}
.month-h{font-size:13px;font-weight:700;color:var(--muted);padding:14px 16px 6px}
.row{display:grid;grid-template-columns:86px 4px 1fr;gap:12px;align-items:center;padding:9px 16px;border:0;background:transparent;width:100%;text-align:left;border-top:1px solid var(--line2)}
.row:hover{background:var(--soft)}
.row .d{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.row .d small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.row .stripe{align-self:stretch;border-radius:3px}

/* ---------- 시트(모달) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:min(560px,100%);max-height:92vh;max-height:92dvh;overscroll-behavior:contain;overflow:auto;border-radius:18px 18px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .18s ease-out}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:18px;padding-bottom:18px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:6px auto 10px}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto;border:0;background:var(--soft);border-radius:8px;width:32px;height:32px;font-size:16px}
.f{margin-bottom:14px}
.f > label,.f > .lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);font-size:15px}
.f textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two > .f{min-width:0}
.f input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2)}
.pick[aria-pressed="true"]{color:var(--card);border-color:transparent}
.pick[data-v="edu"][aria-pressed="true"]{background:var(--edu)} .pick[data-v="eval"][aria-pressed="true"]{background:var(--eval)}
.pick[data-v="trip"][aria-pressed="true"]{background:var(--trip)} .pick[data-v="leave"][aria-pressed="true"]{background:var(--leave)}
.pick[data-v="etc"][aria-pressed="true"]{background:var(--etc)}
.pick.plain[aria-pressed="true"]{background:var(--ink)}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.quick button{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:4px 9px;font-size:12.5px;color:var(--ink2)}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.actions{display:flex;gap:8px;margin-top:6px}
.actions .grow{flex:1}
.dl{display:grid;grid-template-columns:64px 1fr;gap:8px 12px;font-size:14px;margin:0 0 16px}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.mem{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line2);font-size:14px}
.mem small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}

/* ---------- 로그인 화면 ---------- */
.gate{min-height:80vh;display:grid;place-items:center;padding:24px 16px}
.gate-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px 24px;width:min(420px,100%);text-align:center}
.gate-card h1{font-size:24px;margin:0 0 4px;letter-spacing:-.6px}
.gate-card h1 em{font-style:normal;color:var(--fire)}
.gate-card p{color:var(--ink2);font-size:14px;margin:8px 0 18px}
.gate-card .btn{width:100%;padding:12px}
.gate-card code{display:block;background:var(--soft);border-radius:8px;padding:8px;font-size:14px;margin:8px 0 14px;overflow-wrap:anywhere}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;border:0;background:var(--fire);color:#fff;border-radius:999px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(200,16,46,.35)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw;box-shadow:var(--shadow)}
.foot{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.7}

/* ---------- 과정별 색 ---------- */
.cc{--cfg:var(--c)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cc{--cfg:color-mix(in srgb,var(--c) 50%,#fff)}}
:root[data-theme="dark"] .cc{--cfg:color-mix(in srgb,var(--c) 50%,#fff)}
.tag.cc,.badge.cc{background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--cfg)}
.tag.cc.solid,.badge.cc.solid{background:var(--c);color:#fff}
.tag.cc.out,.badge.cc.out{background:var(--card);box-shadow:inset 0 0 0 1px var(--c)}
.ev.cc{background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--cfg);box-shadow:inset 3px 0 0 var(--c)}
.ev.cc.solid{background:var(--c);color:#fff;box-shadow:none}
.ev.cc.out{background:var(--card);box-shadow:inset 0 0 0 1px var(--c)}
.ev.cc.cont-l:not(.out){box-shadow:none}
.ev.cc.plan{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(127,127,127,.16) 6px 9px)}
.stripe.cc{background:var(--c)}
.md.cc{background:color-mix(in srgb,var(--c) 20%,var(--card));color:var(--cfg);font-weight:700}
.md.cc.solid{background:var(--c);color:#fff}
.mlist li{grid-template-columns:8px 40px 1fr;align-items:center}
.mlist li i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.mlist li.solid b{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2);margin:-4px 0 12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;background:color-mix(in srgb,var(--c) 22%,var(--card));box-shadow:inset 2px 0 0 var(--c)}
.legend i.solid{background:var(--c);box-shadow:none}
.legend i.out{background:var(--card);box-shadow:inset 0 0 0 1px var(--c)}
.legend .sep{width:1px;height:12px;background:var(--line)}

.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.crow{display:grid;grid-template-columns:1fr 40px auto;gap:6px;align-items:center;padding:4px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.crow.on{border-color:var(--ink)}
.cprev{display:block;border-radius:6px;padding:6px 9px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--c);box-shadow:inset 3px 0 0 var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cprev.out{background:var(--card);box-shadow:inset 0 0 0 1px var(--c)}
.crow input[type=color]{width:40px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--card);cursor:pointer}
.crow .btn-sm{padding:5px 8px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:30px;height:30px;border-radius:8px;border:2px solid var(--card);background:var(--c);box-shadow:0 0 0 1px var(--line)}
@media (max-width:600px){.cgrid{grid-template-columns:1fr}}

/* ---------- 고도화 ---------- */
.ttl{border:0;background:transparent;font:inherit;font-weight:700;padding:2px 4px;border-radius:6px;color:inherit}
.ttl:hover{background:var(--soft)}
.ttl::after{content:" ▾";font-size:11px;color:var(--muted)}
.phead h2{position:relative}
.jump{position:absolute;left:0;top:100%;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.week{user-select:none;-webkit-user-select:none}
.cell.rng{background:color-mix(in srgb,var(--fire) 13%,transparent)}
.psel{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--ink2);max-width:150px}
.psel.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.foot.keys{display:none}
@media (hover:hover) and (pointer:fine){.foot.keys{display:block;margin-bottom:-8px}}
/* 주간 */
.wk-scroll{overflow-x:auto}
.wk{display:grid;grid-auto-rows:minmax(30px,auto);row-gap:3px;padding:6px 8px 10px;min-width:520px;position:relative}
.wk .wh{border:0;background:transparent;text-align:center;padding:6px 0 8px;font-size:13px;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line2);line-height:1.25}
.wk .wh b{display:block;font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.wk .wh.today b{color:#fff;background:var(--fire);border-radius:999px;width:fit-content;min-width:34px;padding:0 8px;margin:0 auto}
.wk .wh.sun,.wk .wh.hol,.wk .wh.sun b,.wk .wh.hol b{color:var(--sun)} .wk .wh.sat,.wk .wh.sat b{color:var(--sat)}
.wk .wh em{display:block;font-style:normal;font-size:10.5px;color:var(--sun);font-weight:500;min-height:13px}
.wk .sec{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--muted);padding:10px 2px 2px;border-top:1px solid var(--line2);margin-top:4px}
.wk .nm{font-size:13px;font-weight:600;align-self:center;padding-right:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk .nm.me{color:var(--fire)}
.wk .slot{border:0;border-radius:6px;background:transparent;min-height:30px;z-index:0}
.wk .slot:hover{background:var(--soft)}
.wk .slot.wkend{background:var(--soft)}
.wk .colbg{grid-row:1/-1;z-index:-1;background:transparent}
.wk .colbg.today{background:color-mix(in srgb,var(--fire) 5%,transparent)}
.wk .ev{height:auto;min-height:28px;line-height:1.25;padding:5px 8px;white-space:normal;font-size:12.5px;z-index:1;align-self:stretch;display:flex;align-items:center}
.wk .cnt{text-align:center;font-size:12px;font-weight:600;align-self:center;color:var(--ink2)}
.wk .cnt.hi{color:var(--fire)}
.wk .cnt span{display:inline-block;border-radius:5px;padding:2px 6px;background:var(--soft)}
.wk .cnt.hi span{background:var(--fire-soft)}
.wk .empty{grid-column:2/-1}
/* 등록 화면 안내 */
.finfo{font-size:12.5px;line-height:1.55;background:var(--soft);border-radius:10px;padding:9px 11px;margin:-4px 0 14px;color:var(--ink2)}
.finfo:empty{display:none}
.finfo b{color:var(--ink)}
.finfo .warn{color:var(--fire);font-weight:600}
.toast{display:flex;align-items:center;gap:12px}
.toast button{border:0;background:transparent;color:#ffb3bd;font-weight:700;padding:0}
.more-act{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}

/* ---------- 홈 ---------- */
.hello{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 2px 12px}
.hello h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.6px}
.hello p{margin:0;color:var(--muted);font-size:13.5px}
.quick-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 14px}
.qbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 10px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);text-align:left;color:var(--ink)}
.qbtn i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:0 0 auto}
.qbtn small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.qbtn:hover{border-color:var(--c)}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card h3{margin:0;padding:13px 16px 8px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .lnk{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:2px 4px}
.card h3 .lnk:hover{color:var(--ink)}
.card .body{padding:2px 12px 12px}
.card.wide{grid-column:1/-1}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sday{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:8px 6px 7px;text-align:center;display:flex;flex-direction:column;gap:5px;min-width:0}
.sday:hover{border-color:var(--ink2)}
.sday.today{border-color:var(--fire);box-shadow:inset 0 0 0 1px var(--fire)}
.sday .w{font-size:11.5px;color:var(--muted);font-weight:600}
.sday .n{font-size:18px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sday.hol .n,.sday.hol .w{color:var(--sun)}
.sday .bars{display:flex;flex-direction:column;gap:2px;min-height:14px}
.sday .bars i{display:block;height:5px;border-radius:3px;background:var(--c)}
.sday .bars i.solid{height:5px;box-shadow:0 0 0 1px var(--c)}
.sday .ab{font-size:11px;font-weight:600;color:var(--muted)}
.sday .ab.hi{color:var(--fire)}
.hrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:8px 4px;border-top:1px solid var(--line2)}
.hrow:first-child{border-top:0}
.hrow:hover{background:var(--soft)}
.hrow .dd{font-size:12px;font-weight:700;border-radius:6px;padding:3px 0;text-align:center;background:var(--soft);color:var(--ink2);font-variant-numeric:tabular-nums}
.hrow .dd.now{background:var(--fire);color:#fff}
.hrow .dd.soon{background:var(--fire-soft);color:var(--fire)}
.hrow .t{font-weight:600;font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.hrow .t i{width:8px;height:8px;border-radius:2px;background:var(--c);flex:0 0 auto}
.hrow .m{font-size:12px;color:var(--muted);margin-top:1px}
.hrow .r{font-size:12px;color:var(--muted);white-space:nowrap}
.install{display:flex;gap:12px;align-items:center;padding:12px 14px}
.install img{width:44px;height:44px;border-radius:10px;flex:0 0 auto}
.install p{margin:2px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.5}
.install .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- v10 ---------- */
.ico{display:none}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.newb{display:inline-block;background:var(--fire);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.newt{display:inline-block;background:var(--fire);color:#fff;border-radius:4px;padding:0 5px;font-size:10px;font-weight:700;vertical-align:1px}
.notice{border-color:color-mix(in srgb,var(--fire) 35%,var(--line))}
.nrow{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-top:1px solid var(--line2)}
.nrow:first-child{border-top:0}
.nrow > div{flex:1;min-width:0}
.ntext{font-size:14.5px;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.nrow .m{font-size:12px;color:var(--muted);margin-top:2px}
.nrow .x{border:0;background:var(--soft);border-radius:7px;width:28px;height:28px;flex:0 0 auto;color:var(--muted)}
@media print{
  @page{size:A4 landscape;margin:9mm}
  :root{color-scheme:light;padding:0}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:11px}
  .top,.bar,#banner,#vHome,.foot,.fab,#toastRoot,#sheetRoot,.noprint,.nav,#mToday,#wToday,#wWeekend,.legend .btn,#dayPanel,.hint{display:none!important}
  .wrap{max-width:none;padding:0}
  .panel{box-shadow:none;border:1px solid #bbb;border-radius:0}
  .layout{display:block}
  .legend{margin:0 0 6px}
  .ttl::after{content:""}
  body[data-print="month"] #vWeek,body[data-print="month"] #vYear,body[data-print="month"] #vList{display:none!important}
  body[data-print="week"] #vMonth,body[data-print="week"] #vYear,body[data-print="week"] #vList{display:none!important}
  .week{grid-template-rows:20px repeat(5,16px) 12px;min-height:0;break-inside:avoid;row-gap:1px}
  .cell.sel{background:transparent}
  .cell.today .dn b{background:none;color:inherit;padding:0}
  .ev{font-size:9px;line-height:16px;height:16px}
  .wk{min-width:0}
  .phead{border-bottom:1px solid #bbb}
  .phead h2::after{content:" · ICTC 함께";font-size:12px;font-weight:500;color:#666}
}

/* ---------- 시간 고르기 ---------- */
.tbox{background:var(--soft);border-radius:12px;padding:6px 10px 10px;margin-top:8px}
.tlbl{font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 5px}
.tchips{display:flex;flex-wrap:wrap;gap:5px}
.tchips button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.tchips button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.trange{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.trange input{width:auto!important;flex:0 1 130px;padding:8px 10px!important}
.trange b{font-size:13px;color:var(--muted);font-weight:600}

/* ---------- 근무 팀 ---------- */
.tm{position:absolute;top:5px;right:5px;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:4px;padding:0 4px;line-height:16px}
.tm.mine,.tmw.mine,.tms.mine{background:var(--fire);color:#fff}
.cell.out .tm{opacity:.5}
.tmw{display:inline-block;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:4px;padding:0 5px;line-height:16px;margin-top:2px}
.tms{align-self:center;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:4px;padding:0 5px;line-height:16px}
.board{position:relative}
.btm{position:absolute;top:10px;right:12px;font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:3px 10px}
.btm b{font-size:15px;color:var(--ink);font-weight:700}
.btm.mine{background:var(--fire);border-color:var(--fire);color:#fff}
.btm.mine b{color:#fff}
.board-body:has(.btm) .board-row:first-of-type{padding-right:118px}
@media print{.tm{background:none;padding:0}}

/* ---------- 좁은 화면 ---------- */
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .year{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .mark span{display:none}
  /* 폰: 확대 방지(16px), 누르기 쉬운 크기, 한 줄 스크롤 */
  input,select,textarea,.f input,.f select,.f textarea,.search{font-size:16px!important}
  .psel{font-size:14px!important;padding:6px 10px}
  .nav{width:40px;height:40px;font-size:20px}
  .btn-sm{padding:8px 11px}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -10px;padding:2px 10px;width:calc(100% + 20px);-webkit-overflow-scrolling:touch}
  .filters::-webkit-scrollbar,.legend::-webkit-scrollbar{display:none}
  .chip,.psel{flex:0 0 auto}
  .legend{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;scrollbar-width:none;margin:0 -10px 10px;padding:0 10px}
  .legend span{flex:0 0 auto}
  .fab{width:58px;height:58px;padding:0;border-radius:50%;font-size:0;right:16px}
  .fab::before{content:"＋";font-size:28px;font-weight:500;line-height:58px}
  .phead{padding:10px 10px}
  .phead h2{font-size:17px}
  .year{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px}
  .mini{padding:8px 6px}
  .mini h4{font-size:13px}
  .mini h4 small{display:none}
  .md{height:22px;font-size:10px;border-radius:4px}
  .mgrid .h{font-size:9px}
  .mlist{font-size:10.5px;gap:2px}
  .mlist li{grid-template-columns:6px 30px 1fr;gap:4px}
  .mlist li:nth-child(n+4){display:none}
  .row{grid-template-columns:62px 4px 1fr;gap:10px;padding:10px 12px}
  .listtools{padding:10px}
  .listtools .btn{flex:1 1 auto}
  .sheet{padding-left:16px;padding-right:16px}
  .sheet h3{font-size:18px}
  .pick{padding:10px 13px}
  .quick button{padding:6px 10px;font-size:13px}
  .tchips button{padding:8px 10px;font-size:13.5px}
  #fHours button{min-width:calc((100% - 20px) / 5)}
  .item{padding:11px 10px 11px 0}
  .hrow{padding:10px 4px}
  .wrap{padding:12px 10px 110px}
  .filters{margin-left:0}
  .week{grid-template-rows:24px repeat(3,18px) 16px;min-height:90px}
  .ev{font-size:10px;line-height:18px;height:18px;padding:0 3px;margin:0 1px}
  .ev.cc:not(.out){box-shadow:none}
  .dn{left:4px;font-size:12px}
  .dn em{display:none}
  .tm{top:4px;right:2px;font-size:9.5px;padding:0 2px;line-height:14px}
  .cell.today .dn b{padding:0 4px}
  .cell .dn{left:3px}
  .btm{position:static;align-self:flex-end;font-size:12px;padding:2px 8px;margin:-2px -2px 0 0}
  .btm b{font-size:14px}
  .board-body:has(.btm) .board-row:first-of-type{padding-right:0}
  .dn{max-width:calc(100% - 26px)}
  .more{font-size:10px;padding-left:3px}

  .board-date{min-width:88px;padding:12px}
  .board-date strong{font-size:26px}
  .board-body{padding:10px 12px}
  .who .nm{display:none}
  .home-grid{grid-template-columns:1fr}
  .quick-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hello h1{font-size:19px}
  .strip{gap:4px}
  .sday{padding:7px 3px 6px}
  .install{flex-wrap:wrap}
  .install .acts{margin-left:0;width:100%;justify-content:flex-start}
  #viewTabs{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:0;border:0;border-top:1px solid var(--line);
    padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);box-shadow:0 -4px 16px rgba(0,0,0,.05)}
  #viewTabs button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;padding:5px 0;border-radius:10px}
  #viewTabs button[aria-pressed="true"]{background:transparent;color:var(--fire)}
  #viewTabs .ico{display:block;line-height:0}
  .fab{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(132px + env(safe-area-inset-bottom,0px))}
  .wrap{padding-bottom:150px}
  .bar{margin-bottom:8px}
  .wk.fit{min-width:0}
  .wk{padding:4px 4px 8px}
  .wk .ev{font-size:11px;padding:4px 5px;min-height:26px}
  .wk .nm{font-size:12px;padding-right:2px}
  .wk .wh b{font-size:16px}
  .wk .cnt{font-size:10.5px}
  .wk .cnt span{padding:1px 3px}
  #wTitle{font-size:15px}
  #vWeek .phead{flex-wrap:wrap}
  #vWeek .phead .right .btn{white-space:nowrap}
  .who{padding:3px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="mark" id="logo" role="button" tabindex="0" title="홈으로" style="cursor:pointer"><b>ICTC <em>함께</em></b><span>지휘역량강화센터 일정</span></div>
    <div class="top-right" id="topRight"></div>
  </div>
</header>

<div id="gate" class="gate hide"></div>

<main id="app" class="wrap hide">
  <div id="banner"></div>
  <div class="bar">
    <div class="seg" id="viewTabs" role="group" aria-label="보기">
      <button data-view="home" aria-pressed="true"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>홈</button>
      <button data-view="week" aria-pressed="false"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 14h8M8 17h5"/></svg></span>주간</button>
      <button data-view="month" aria-pressed="false"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>월간</button>
      <button data-view="year" aria-pressed="false"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>연간</button>
      <button data-view="list" aria-pressed="false"><span class="ico"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></span>목록</button>
</div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="legend" id="legend"></div>

  <section id="vHome">
    <div class="hello" id="hello"></div>
    <section class="board" id="board" aria-label="오늘 상황판"></section>
    <div class="quick-row" id="quickRow"></div>
    <div class="home-grid" id="homeGrid"></div>
  </section>

  <section id="vMonth" class="layout hide">
    <div class="panel">
      <div class="phead">
        <button class="nav" id="mPrev" aria-label="이전 달">‹</button>
        <h2><button class="ttl" id="mTitle" title="달 고르기"></button><input type="month" id="mJump" class="jump" tabindex="-1" aria-hidden="true"></h2>
        <button class="nav" id="mNext" aria-label="다음 달">›</button>
        <div class="right"><button class="btn btn-line btn-sm noprint" id="mPrint" title="이 달 인쇄">인쇄</button><button class="btn btn-line btn-sm" id="mToday">오늘</button></div>
      </div>

/* =========================================================
   5) 비밀번호 확인용 지문(해시)
      비밀번호 원문은 어디에도 저장하지 않고, 아래 계산 결과만 Firebase에 둡니다.
   ========================================================= */
async function pwKey(pw, kind){
  const salt = `ictc-hamkke:${kind}:${FIREBASE_CONFIG.projectId || "demo"}`;
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name:"PBKDF2", hash:"SHA-256", salt: enc.encode(salt), iterations: 150000 }, base, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2,"0")).join("");
}

const LS = "ictc-hamkke-demo-v2";
const DEMO_PW = { staff: "ictc2026", admin: "admin2026" };
const local = {
  data: null,
  async init(){

    this.data = { events: seedEvents(), k: await pwKey(DEMO_PW.staff, "staff"), a: await pwKey(DEMO_PW.admin, "admin"), session: null, adminUntil: 0, access: { open:false, numeric:false }, demoStaff: DEMO_PW.staff, notices: [{ id:"n1", text:"체험 모드 공지 예시입니다. 관리자 모드에서 공지를 올리고 지울 수 있습니다.", until:"", by:"센터", at:new Date().toISOString() }] };
    this.save();
  },
  save(){ try { localStorage.setItem(LS, JSON.stringify(this.data)); } catch(e){} }
};

const store = {
  /* ----- 접속 ----- */
  async getAccess(){
    if (S.mode === "demo") return local.data.access;
    const { fs, db } = S.fb;
    try { const d = await fs.getDoc(fs.doc(db, "settings", "access")); if (d.exists()) return { open: !!d.data().open, numeric: !!d.data().numeric }; } catch(e){ console.warn(e); }
    return { open:false, numeric:false };
  },
  async setAccess(a){
    if (S.mode === "demo"){ local.data.access = a; local.save(); return; }
    const { fs, db } = S.fb; await fs.setDoc(fs.doc(db, "settings", "access"), { open: !!a.open, numeric: !!a.numeric });
  },
  async setColors(c){
    if (S.mode === "demo"){ local.data.colors = c; local.save(); return; }
    const { fs, db } = S.fb; await fs.setDoc(fs.doc(db, "settings", "colors"), { c });
  },
  async login(pw, name){
    if (S.access.open){
      if (S.mode === "demo"){ local.data.session = "open"; local.save(); return; }
      const { auth, authObj } = S.fb; if (!authObj.currentUser) await auth.signInAnonymously(authObj); return;
    }
    const k = await pwKey(pw, "staff");
    if (S.mode === "demo"){
      if (k !== local.data.k) throw new AuthError("공용 비밀번호가 맞지 않습니다.");
      local.data.session = k; local.save(); return;
    }
    const { fs, db, auth, authObj } = S.fb;
    if (!authObj.currentUser) await auth.signInAnonymously(authObj);
    try { await fs.setDoc(fs.doc(db, "sessions", authObj.currentUser.uid), { k, name, at: fs.serverTimestamp() }); }
    catch(e){ if (e.code === "permission-denied") throw new AuthError("공용 비밀번호가 맞지 않습니다."); throw e; }
  },
  async logout(){
    if (S.mode === "demo"){ local.data.session = null; local.data.adminUntil = 0; local.save(); return; }
    const { fs, db, auth, authObj } = S.fb, uid = authObj.currentUser?.uid;
    if (uid){
      await fs.deleteDoc(fs.doc(db, "adminSessions", uid)).catch(() => {});
      await fs.deleteDoc(fs.doc(db, "sessions", uid)).catch(() => {});
    }
    await auth.signOut(authObj);
  },
  async adminOn(pw){
    const a = await pwKey(pw, "admin"), until = Date.now() + ADMIN_MINUTES * 60e3;
    if (S.mode === "demo"){
      if (a !== local.data.a) throw new AuthError("관리자 비밀번호가 맞지 않습니다.");
      local.data.adminUntil = until; local.save(); return until;
    }
    const { fs, db, authObj } = S.fb;
    try { await fs.setDoc(fs.doc(db, "adminSessions", authObj.currentUser.uid), { a, exp: fs.Timestamp.fromMillis(until) }); }
    catch(e){ if (e.code === "permission-denied") throw new AuthError("관리자 비밀번호가 맞지 않습니다."); throw e; }
    return until;
  },
  async adminOff(){
    if (S.mode === "demo"){ local.data.adminUntil = 0; local.save(); return; }
    const { fs, db, authObj } = S.fb;
    await fs.deleteDoc(fs.doc(db, "adminSessions", authObj.currentUser.uid)).catch(() => {});
  },
  // 관리자 모드에서만: 공용 비밀번호 바꾸기 → 다른 기기는 모두 다시 로그인해야 함
  async changeStaffPw(pw){
    const k = await pwKey(pw, "staff");
    if (S.mode === "demo"){ local.data.k = k; local.data.session = k; local.data.demoStaff = pw; local.save(); return; }
    const { fs, db, authObj } = S.fb, uid = authObj.currentUser.uid;
    const old = await fs.getDocs(fs.collection(db, "keys"));
    await fs.setDoc(fs.doc(db, "keys", k), { at: fs.serverTimestamp() });
    await fs.setDoc(fs.doc(db, "sessions", uid), { k, name: S.me.name, at: fs.serverTimestamp() });
    await Promise.all(old.docs.filter(d => d.id !== k).map(d => fs.deleteDoc(d.ref)));
  },
  async changeAdminPw(pw){
    const a = await pwKey(pw, "admin");
    if (S.mode === "demo"){ local.data.a = a; local.save(); return; }
    const { fs, db, authObj } = S.fb, uid = authObj.currentUser.uid;
    const old = await fs.getDocs(fs.collection(db, "adminKeys"));
    await fs.setDoc(fs.doc(db, "adminKeys", a), { at: fs.serverTimestamp() });
    await fs.setDoc(fs.doc(db, "adminSessions", uid), { a, exp: fs.Timestamp.fromMillis(S.adminUntil) });
    await Promise.all(old.docs.filter(d => d.id !== a).map(d => fs.deleteDoc(d.ref)));
  },
  async samePw(pw, kind){ // 공용·관리자 비밀번호가 같아지지 않게
    const other = kind === "staff" ? "admin" : "staff";
    if (S.mode === "demo") return (await pwKey(pw, other)) === local.data[other === "staff" ? "k" : "a"];
    return false; // 공유 모드에서는 서로 다른 지문만 저장되어 비교할 수 없음 → 화면에서 안내
  },

  /* ----- 일정 ----- */
  async saveEvent(ev){
    if (S.mode === "demo"){ const i = S.events.findIndex(x => x.id === ev.id); i >= 0 ? S.events[i] = ev : S.events.push(ev); local.data.events = S.events; local.save(); render(); return; }
    const { fs, db } = S.fb; await fs.setDoc(fs.doc(db, "events", ev.id), ev);
  },
  async deleteEvent(id){
    if (S.mode === "demo"){ S.events = S.events.filter(x => x.id !== id); local.data.events = S.events; local.save(); render(); return; }
    const { fs, db } = S.fb; await fs.deleteDoc(fs.doc(db, "events", id));
  },
  async saveNotice(n){
    if (S.mode === "demo"){ S.notices = [...S.notices.filter(x => x.id !== n.id), n]; local.data.notices = S.notices; local.save(); render(); return; }
    const { fs, db } = S.fb; await fs.setDoc(fs.doc(db, "notices", n.id), n);
  },
  async deleteNotice(id){
    if (S.mode === "demo"){ S.notices = S.notices.filter(x => x.id !== id); local.data.notices = S.notices; local.save(); render(); return; }
    const { fs, db } = S.fb; await fs.deleteDoc(fs.doc(db, "notices", id));
  },
  async saveMany(list){
    if (S.mode === "demo"){ list.forEach(ev => { const i = S.events.findIndex(x => x.id === ev.id); i >= 0 ? S.events[i] = ev : S.events.push(ev); }); local.data.events = S.events; local.save(); render(); return; }
    const { fs, db } = S.fb;
    for (let i = 0; i < list.length; i += 20){ const b = fs.writeBatch(db); list.slice(i, i+20).forEach(ev => b.set(fs.doc(db, "events", ev.id), ev)); await b.commit(); }
  },
  async deleteMany(ids){
    if (S.mode === "demo"){ const s = new Set(ids); S.events = S.events.filter(x => !s.has(x.id)); local.data.events = S.events; local.save(); render(); return; }
    const { fs, db } = S.fb;
    for (let i = 0; i < ids.length; i += 20){ const b = fs.writeBatch(db); ids.slice(i, i+20).forEach(id => b.delete(fs.doc(db, "events", id))); await b.commit(); }
  },
  async importSeed(){
    const list = seedEvents();
    if (S.mode === "demo"){ const have = new Set(S.events.map(e=>e.id)); list.forEach(e => have.has(e.id) || S.events.push(e)); local.data.events = S.events; local.save(); render(); return list.length; }
    const { fs, db } = S.fb;
    for (let i = 0; i < list.length; i += 20){
      const b = fs.writeBatch(db);
      list.slice(i, i+20).forEach(e => b.set(fs.doc(db, "events", e.id), { ...e, updatedAt: new Date().toISOString() }));
      await b.commit();
    }
    return list.length;
  }
};

const ago = iso => {
  if (!iso) return ""; const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "방금"; if (m < 60) return `${m}분 전`; const h = Math.round(m / 60); if (h < 24) return `${h}시간 전`;
  const d = Math.round(h / 24); return d < 7 ? `${d}일 전` : md(new Date(iso).toISOString().slice(0,10));
};

function renderMonth(){
  const m = S.month, y = m.getFullYear(), mo = m.getMonth();
  $("mTitle").textContent = `${y}년 ${mo+1}월`; $("mJump").value = `${y}-${pad(mo+1)}`;
  const first = new Date(y, mo, 1, 12), start = addDays(first, -first.getDay());
  const last = new Date(y, mo+1, 0, 12);
  const weeksN = Math.ceil((first.getDay() + last.getDate()) / 7);
  const vis = visible();
  const LANES = S.printing ? 5 : 3;
  let html = "";
  for (let w = 0; w < weeksN; w++){
    const ws = addDays(start, w*7), wsS = ymd(ws), weS = ymd(addDays(ws, 6));
    let cells = "";
    for (let i = 0; i < 7; i++){
      const d = addDays(ws, i), ds = ymd(d), hol = HOLIDAYS[ds];
      const cls = ["cell", d.getMonth() !== mo && "out", i === 0 && "sun", i === 6 && "sat", hol && "hol", ds === TODAY && "today", ds === S.sel && "sel"].filter(Boolean).join(" ");
      cells += `<button class="${cls}" style="grid-column:${i+1}" data-day="${ds}" aria-label="${mdw(ds)}"><span class="dn"><b>${d.getDate()}</b>${hol ? `<em>${esc(hol)}</em>` : ""}</span>${teamTag(ds)}</button>`;
    }
    // 주 단위로 막대 배치
    const evs = sortEv(vis.filter(e => e.start <= weS && e.end >= wsS));
    const laneEnd = [], hidden = Array(7).fill(0); let bars = "";
    evs.forEach(e => {
      const c1 = Math.max(0, diff(wsS, e.start)), c2 = Math.min(6, diff(wsS, e.end));
      let lane = laneEnd.findIndex(end => end < c1);
      if (lane < 0){ lane = laneEnd.length; laneEnd.push(-1); }
      laneEnd[lane] = c2;
      if (lane >= LANES){ for (let c = c1; c <= c2; c++) hidden[c]++; return; }
      const cl = ["ev", e.cat, tcls(e), e.plan && "plan", e.start < wsS && "cont-l", e.end > weS && "cont-r"].filter(Boolean).join(" ");
      bars += `<button class="${cl}" style="${tst(e)};grid-column:${c1+1}/${c2+2};grid-row:${lane+2}" data-id="${esc(e.id)}" title="${esc(label(e))}">${esc(label(e))}</button>`;
    });
    hidden.forEach((n, c) => { if (n) bars += `<span class="more" style="grid-column:${c+1};grid-row:${LANES+2}">+${n}</span>`; });
    html += `<div class="week">${cells}${bars}</div>`;
  }
  $("weeks").innerHTML = html;
  $("weeks").querySelectorAll("[data-day]").forEach(b => {
    b.addEventListener("click", () => { if (drag.skip){ drag.skip = false; return; } S.sel = b.dataset.day; renderMonth(); if (isPhone()) openDay(b.dataset.day); });
    b.addEventListener("dblclick", () => openForm(null, b.dataset.day));
    b.addEventListener("pointerdown", ev => { if (ev.pointerType !== "mouse" || ev.button !== 0) return; drag.a = drag.b = b.dataset.day; });
  });
  $("weeks").querySelectorAll(".ev").forEach(b => b.addEventListener("click", ev => { ev.stopPropagation(); openDetail(b.dataset.id); }));
  renderDay();
}

  $("dayPanel").querySelectorAll("[data-id]").forEach(b => b.addEventListener("click", () => openDetail(b.dataset.id)));
  $("addHere")?.addEventListener("click", () => openForm(null, S.sel));
}

function renderYear(){
  const y = S.year; $("yTitle").textContent = `${y}년`;
  const vis = visible();
  let html = "";
  for (let mo = 0; mo < 12; mo++){
    const first = new Date(y, mo, 1, 12), days = new Date(y, mo+1, 0).getDate();
    const mS = ymd(first), mE = ymd(new Date(y, mo, days, 12));
    const inMonth = vis.filter(e => e.start <= mE && e.end >= mS);
    let g = WD.map(w => `<span class="h">${w}</span>`).join("") + "<span></span>".repeat(first.getDay());
    for (let d = 1; d <= days; d++){
      const ds = `${y}-${pad(mo+1)}-${pad(d)}`, on = onDay(inMonth, ds), dow = (first.getDay()+d-1) % 7;
      const work = dow !== 0 && dow !== 6 && !HOLIDAYS[ds];
      const course = !work ? null : (on.find(e => e.cat === "eval") || on.find(e => e.cat === "edu"));
      const dots = ["trip","leave","etc"].filter(c => on.some(e => e.cat === c));
      const cls = ["md", course && tcls(course), (HOLIDAYS[ds] || dow === 0) && "sun", ds === TODAY && "today"].filter(Boolean).join(" ");
      g += `<button class="${cls}" ${course ? `style="${tst(course)}"` : ""} data-day="${ds}" title="${esc(course ? course.title : (HOLIDAYS[ds] || ""))}">${d}${dots.length ? `<span class="dots">${dots.map(c=>`<i class="${c}"></i>`).join("")}</span>` : ""}</button>`;
    }
    const courses = sortEv(inMonth.filter(e => (e.cat === "edu" || e.cat === "eval") && e.start >= mS));
    const away = inMonth.filter(e => e.cat === "trip" || e.cat === "leave").length;
    html += `<div class="mini"><h4>${mo+1}월 <small>${courses.length ? `교육·평가 ${courses.length}` : ""}${away ? ` · 출장·휴가 ${away}` : ""}</small></h4>
      <div class="mgrid">${g}</div>
      ${courses.length ? `<ul class="mlist">${courses.slice(0,6).map(e => `<li class="${e.plan?"plan":""} ${e.cat==="eval"?"solid":""}" style="${tst(e)}"><i></i><span>${md(e.start)}${e.end!==e.start?"~":""}</span><b>${esc(e.title)}</b></li>`).join("")}${courses.length>6?`<li><i style="background:none"></i><span></span><b>외 ${courses.length-6}건</b></li>`:""}</ul>` : ""}
    </div>`;
  }
  $("yearGrid").innerHTML = html;
  $("yearGrid").querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => {
    S.sel = b.dataset.day; S.month = pd(S.sel.slice(0,8)+"01"); setView("month");
  }));
}

function listData(){

    (!q || [e.title, e.person, e.place, e.memo, e.ownerName, CATS[e.cat], staffOf(e).join(" "), e.kind, e.reason].join(" ").toLowerCase().includes(q))));
}
function exportCsv(){

function printView(kind){

function weekText(){
  const t = pd(TODAY), mon = addDays(t, -((t.getDay()+6)%7));
  const lines = [`[ICTC 함께] ${md(ymd(mon))}~${md(ymd(addDays(mon,4)))} 주간 일정`];
  for (let i = 0; i < 5; i++){
    const ds = ymd(addDays(mon, i)), list = sortEv(onDay(S.events, ds));
    lines.push("", `${mdw(ds)}${teamPref().show ? ` [${teamOf(ds)}팀]` : ""}${HOLIDAYS[ds] ? " " + HOLIDAYS[ds] : ""}`);

/* 달력에서 날짜 끌어 기간 고르기 (마우스) */
const drag = { a:null, b:null, skip:false };
function paintDrag(){
  const [s, e] = [drag.a, drag.b].sort();
  $("weeks").querySelectorAll("[data-day]").forEach(c => c.classList.toggle("rng", !!drag.a && drag.a !== drag.b && c.dataset.day >= s && c.dataset.day <= e));
}
function dragMove(ev){
  if (!drag.a) return;
  const wk = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".week"); if (!wk) return;
  const r = wk.getBoundingClientRect(), c = Math.min(6, Math.max(0, Math.floor((ev.clientX - r.left) / (r.width / 7))));
  const cell = wk.querySelectorAll("[data-day]")[c];
  if (cell && cell.dataset.day !== drag.b){ drag.b = cell.dataset.day; paintDrag(); }
}
document.addEventListener("pointermove", dragMove);
document.addEventListener("pointerup", () => {
  if (!drag.a) return;
  const [s, e] = [drag.a, drag.b].sort(); const moved = drag.a !== drag.b;
  drag.a = drag.b = null; paintDrag();
  if (moved){ drag.skip = true; setTimeout(() => drag.skip = false, 50); openForm(null, s, { end: e }); }
});

/* ---------- 주간 보기 ---------- */
function renderWeek(){
  if (!S.week) S.week = monday(pd(S.sel));
  const N = S.weekend ? 7 : 5;
  const days = Array.from({ length: N }, (_, i) => ymd(addDays(S.week, i)));
  const first = days[0], last = days[N-1], vis = visible(), narrow = matchMedia("(max-width:600px)").matches;
  const wkNo = Math.ceil((pd(first).getDate() + new Date(pd(first).getFullYear(), pd(first).getMonth(), 1).getDay()) / 7);
  $("wTitle").textContent = `${pd(first).getMonth()+1}월 ${wkNo}주 · ${md(first)}~${md(last)}`;
  $("wWeekend").setAttribute("aria-pressed", S.weekend);
  const col = ds => days.indexOf(ds);
  const span = e => [Math.max(0, col(e.start < first ? first : e.start)), col(e.end > last ? last : e.end)];
  let row = 1, html = `<div></div>`;
  days.forEach((ds, i) => {
    const d = pd(ds), dow = d.getDay(), hol = HOLIDAYS[ds];
    const cls = ["wh", ds === TODAY && "today", dow === 0 && "sun", dow === 6 && "sat", hol && "hol"].filter(Boolean).join(" ");
    html += `<button class="${cls}" style="grid-column:${i+2};grid-row:1" data-wday="${ds}">${WD[dow]}<b>${d.getDate()}</b><em>${esc(hol || "")}</em>${teamTag(ds, "tmw")}</button>`;
    html += `<div class="colbg ${ds === TODAY ? "today" : ""}" style="grid-column:${i+2}"></div>`;
  });
  row = 2;
  // 교육·평가
  const courses = sortEv(vis.filter(e => (e.cat === "edu" || e.cat === "eval") && e.start <= last && e.end >= first));
  html += `<div class="sec" style="grid-row:${row++}">교육·평가</div>`;
  const pack = list => { const lanes = []; list.forEach(e => { const [a,b] = span(e); let l = lanes.findIndex(x => x < a); if (l < 0){ l = lanes.length; lanes.push(-1); } lanes[l] = b; e._l = l; e._a = a; e._b = b; }); return Math.max(1, lanes.length); };
  const bar = (e, r, lbl) => `<button class="ev ${e.cat} ${tcls(e)} ${e.plan ? "plan" : ""} ${e.start < first ? "cont-l" : ""} ${e.end > last ? "cont-r" : ""}" style="${tst(e)};grid-column:${e._a+2}/${e._b+3};grid-row:${r + e._l}" data-id="${esc(e.id)}" title="${esc(label(e))}">${esc(lbl)}</button>`;
  if (courses.length){
    const n = pack(courses);
    courses.forEach(e => html += bar(e, row, label(e)));
    row += n;
  } else { html += `<div class="hint empty" style="grid-row:${row++};padding:4px 2px">교육·평가 없음</div>`; }
  // 부재 인원
  html += `<div class="nm" style="grid-row:${row};color:var(--muted)">부재</div>`;
  days.forEach((ds, i) => {
    const away = vis.filter(e => (e.cat === "trip" || e.cat === "leave") && e.start <= ds && e.end >= ds);
    const t = away.filter(e => e.cat === "trip").length, l = away.filter(e => e.cat === "leave").length;
    html += `<div class="cnt ${t + l >= 3 ? "hi" : ""}" style="grid-column:${i+2};grid-row:${row}">${t + l ? `<span title="출장 ${t}명, 휴가 ${l}명">${narrow ? `${t + l}명` : [t && `출장 ${t}`, l && `휴가 ${l}`].filter(Boolean).join(" · ")}</span>` : "–"}</div>`;
  });
  row++;
  // 직원별
  const personal = sortEv(vis.filter(e => PERSONAL.includes(e.cat) && e.start <= last && e.end >= first));
  const assigned = courses.filter(e => staffOf(e).length);
  const names = [...new Set([...personal.filter(e => e.person).map(e => e.person), ...assigned.flatMap(staffOf)])].filter(n => !S.person || n === S.person).sort((a,b) => (a === S.me.name ? -1 : b === S.me.name ? 1 : a.localeCompare(b, "ko")));
  if (!names.includes(S.me.name) && (!S.person || S.person === S.me.name)) names.unshift(S.me.name);
  html += `<div class="sec" style="grid-row:${row++}">직원 일정</div>`;
  names.forEach(n => {
    const mine = [...personal.filter(e => e.person === n), ...assigned.filter(e => staffOf(e).includes(n)).map(e => ({ ...e, _asg: true }))], k = pack(mine);
    html += `<div class="nm ${n === S.me.name ? "me" : ""}" style="grid-row:${row}/${row+k}" title="${esc(n)}">${esc(n)}</div>`;
    days.forEach((ds, i) => { const dow = pd(ds).getDay(); html += `<button class="slot ${dow === 0 || dow === 6 || HOLIDAYS[ds] ? "wkend" : ""}" style="grid-column:${i+2};grid-row:${row}/${row+k}" data-slot="${ds}" data-person="${esc(n)}" aria-label="${esc(n)} ${mdw(ds)} 일정 등록"></button>`; });
    mine.forEach(e => html += bar(e, row, e._asg ? `담당 · ${e.title}` : e.cat === "leave" ? ((timeText(e) ? timeText(e) + " " : "") + leaveText(e)) : e.cat === "trip" ? `${timeText(e) ? timeText(e) + " " : ""}출장${e.place ? " · " + e.place : ""}` : label(e)));
    row += k;
  });
  const etc = personal.filter(e => !e.person);
  if (etc.length){ const k = pack(etc); html += `<div class="nm" style="grid-row:${row}/${row+k}">기타</div>`; etc.forEach(e => html += bar(e, row, label(e))); row += k; }
  const g = $("wGrid");
  g.style.gridTemplateColumns = `${narrow ? 50 : 72}px repeat(${N}, minmax(0,1fr))`;
  g.classList.toggle("fit", N === 5);
  g.innerHTML = html;
  g.querySelectorAll(".ev").forEach(b => b.addEventListener("click", () => openDetail(b.dataset.id)));
  g.querySelectorAll("[data-slot]").forEach(b => b.addEventListener("click", () => openForm(null, b.dataset.slot, { person: b.dataset.person })));
  g.querySelectorAll("[data-wday]").forEach(b => b.addEventListener("click", () => { S.sel = b.dataset.wday; S.month = pd(S.sel.slice(0,8)+"01"); setView("month"); }));
}

/* 이전·다음 (버튼, 키보드, 밀기 공통) */
function shift(dir){
  if (S.view === "month"){ S.month = new Date(S.month.getFullYear(), S.month.getMonth()+dir, 1, 12); renderMonth(); renderLegend(); }
  else if (S.view === "week"){ S.week = addDays(S.week || monday(pd(S.sel)), 7*dir); renderWeek(); renderLegend(); }
  else if (S.view === "year"){ S.year += dir; renderYear(); renderLegend(); }
}
function goToday(){
  S.sel = TODAY; S.month = pd(TODAY.slice(0,8)+"01"); S.week = monday(pd(TODAY)); S.year = pd(TODAY).getFullYear(); render();
}
function swipe(el){
  let x0 = null, y0 = 0;
  el.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
  el.addEventListener("touchend", e => {
    if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 50) shift(dx < 0 ? 1 : -1);
  }, { passive:true });
}

function setView(v){
  S.view = v;
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === v));
  $("vHome").classList.toggle("hide", v !== "home");
  $("filters").classList.toggle("hide", v === "home");
  $("vMonth").classList.toggle("hide", v !== "month");
  $("vYear").classList.toggle("hide", v !== "year");
  $("vWeek").classList.toggle("hide", v !== "week");
  if (v === "week") S.week = monday(pd(S.sel));
  $("vList").classList.toggle("hide", v !== "list");
  render();
}

function renderLegend(){
  let from, to;
  if (S.view === "month"){ const y = S.month.getFullYear(), m = S.month.getMonth(); from = ymd(new Date(y, m, 1, 12)); to = ymd(new Date(y, m+1, 0, 12)); }
  else if (S.view === "year"){ from = `${S.year}-01-01`; to = `${S.year}-12-31`; }
  else if (S.view === "home"){ $("legend").innerHTML = ""; return; }
  else if (S.view === "week"){ const w = S.week || monday(pd(S.sel)); from = ymd(w); to = ymd(addDays(w, 6)); }
  else { $("legend").innerHTML = ""; return; }
  const seen = new Map();
  visible().filter(e => (e.cat === "edu" || e.cat === "eval") && e.start <= to && e.end >= from).forEach(e => { const x = tone(e); if (!seen.has(x.name)) seen.set(x.name, x.c); });
  const items = [...seen].map(([n,c]) => `<span><i style="--c:${c}"></i>${esc(n)}</span>`).join("");
  $("legend").innerHTML = items + (items ? `<span class="sep"></span>` : "") +
    `<span><i class="solid" style="--c:${colorOf("other")}"></i>진한 색 = 평가</span><span><i class="out" style="--c:${colorOf("trip")}"></i>테두리 = 출장·휴가</span>` +

  $("lgEdit")?.addEventListener("click", openColors);
}

function render(){
