/* =========================================================
   8) 시트: 상세, 등록·수정, 관리자, 내 접속
   ========================================================= */
function sheet(html, onMount){
  const root = $("sheetRoot");
  root.innerHTML = `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  document.body.classList.add("locked");
  const close = () => { root.innerHTML = ""; document.body.classList.remove("locked"); document.removeEventListener("keydown", esc_); };
  // 폰: 시트를 아래로 끌어내려 닫기
  const sh = root.querySelector(".sheet"); let y0 = null, dy = 0;
  sh.addEventListener("touchstart", e => { if (sh.scrollTop > 0 || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { y0 = null; return; } y0 = e.touches[0].clientY; dy = 0; }, { passive:true });
  sh.addEventListener("touchmove", e => { if (y0 === null) return; dy = e.touches[0].clientY - y0; if (dy > 0){ sh.style.transform = `translateY(${dy}px)`; sh.style.transition = "none"; } }, { passive:true });
  sh.addEventListener("touchend", () => { if (y0 === null) return; y0 = null; sh.style.transition = "transform .18s"; if (dy > 110) close(); else sh.style.transform = ""; });
  const esc_ = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", esc_);
  root.querySelector(".scrim").addEventListener("click", e => { if (e.target.classList.contains("scrim")) close(); });
  root.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close));
  onMount?.(root, close);
  root.querySelector("input,button:not(.x)")?.focus({ preventScroll:true });
  return close;
}

function choose(title, options){
  return new Promise(resolve => {
    let done = false;
    const closeFn = sheet(`<h3>${esc(title)}<button class="x" data-close aria-label="닫기">✕</button></h3>
      <div style="display:flex;flex-direction:column;gap:8px">${options.map(([t, v]) => `<button class="btn btn-line" data-v="${v}">${esc(t)}</button>`).join("")}</div>`,
      (root, close) => root.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => { done = true; close(); resolve(+b.dataset.v); })));
    const obs = new MutationObserver(() => { if (!$("sheetRoot").innerHTML){ obs.disconnect(); if (!done) resolve(0); } });
    obs.observe($("sheetRoot"), { childList:true });
  });
}
function icsText(list){
  const d = s => s.replace(/-/g, ""), x = s => String(s || "").replace(/\\/g, "\\\\").replace(/[;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const ev = list.map(e => ["BEGIN:VEVENT", `UID:${e.id}@ictc-hamkke`, `DTSTAMP:${stamp}`, ...(timeText(e) ? [`DTSTART:${d(e.start)}T${e.time.replace(":", "")}00`, `DTEND:${d(e.end)}T${(e.timeEnd || fromMin(toMin(e.time) + 60)).replace(":", "")}00`]
      : [`DTSTART;VALUE=DATE:${d(e.start)}`, `DTEND;VALUE=DATE:${d(ymd(addDays(pd(e.end), 1)))}`]),
    `SUMMARY:${x(label(e))}`, e.place && `LOCATION:${x(e.place)}`, e.memo && `DESCRIPTION:${x(e.memo)}`, "END:VEVENT"].filter(Boolean).join("\r\n"));
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//ICTC hamkke//KO", "CALSCALE:GREGORIAN", ...ev, "END:VCALENDAR"].join("\r\n");
}
function downloadIcs(list, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([icsText(list)], { type:"text/calendar;charset=utf-8" }));
  a.download = name.replace(/[\\/:*?"<>|]/g, " "); document.body.append(a); a.click(); a.remove();
  toast("파일을 열면 폰 캘린더에 추가됩니다.");
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast("복사했습니다. 단톡방에 붙여 넣으세요."); }
  catch(e){ sheet(`<h3>복사할 글<button class="x" data-close>✕</button></h3><textarea style="width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;padding:10px">${esc(text)}</textarea>`); }
}

function openDetail(id){
  const e = S.events.find(x => x.id === id); if (!e) return;
  const days = diff(e.start, e.end) + 1;
  const rows = [
    ["분류", (e.cat === "edu" || e.cat === "eval" ? tone(e).name + " · " : "") + CATS[e.cat] + (e.cat === "leave" ? ` · ${kindOf(e)} · ${HALF[e.half||"full"]}` : "") + (e.plan ? " · 계획(안)" : "")],
    ["기간", rangeText(e) + (days > 1 ? ` · ${days}일` : "")],
    timeText(e) && ["시간", timeText(e)],
    e.person && [PERSONAL.includes(e.cat) ? "이름" : "담당", e.person],
    staffOf(e).length && ["담당 교관", staffOf(e).join(", ")],
    e.place && ["장소", e.place],
    (e.title && (e.cat === "trip" || e.cat === "leave")) && ["내용", e.title],
    e.reason && ["사유", e.reason],
    e.memo && ["메모", e.memo],
    e.ownerName && ["등록", e.ownerName]
  ].filter(Boolean);
  sheet(`<h3><span class="badge ${tcls(e)}" style="${tst(e)};font-size:12px;border-radius:6px;padding:3px 8px;white-space:nowrap">${CATS[e.cat]}</span>${esc(label(e))}<button class="x" data-close aria-label="닫기">✕</button></h3>
    <dl class="dl">${rows.map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <div class="more-act"><button class="btn btn-line btn-sm" id="ics">📅 내 폰 캘린더에 추가</button><button class="btn btn-line btn-sm" id="cpy">글 복사</button>${canEdit(e) ? `<button class="btn btn-line btn-sm" id="dup">복제</button>` : ""}</div>
    ${e.seriesId ? `<p class="hint" style="margin:-6px 0 12px">반복 일정입니다. (모두 ${S.events.filter(x => x.seriesId === e.seriesId).length}건)</p>` : ""}
    ${canEdit(e) ? `<div class="actions"><button class="btn btn-danger" id="del">삭제</button><button class="btn btn-ink grow" id="edit">수정</button></div>`
      : `<p class="hint">교육·평가 일정은 관리자 모드에서 고칠 수 있습니다.</p>`}`,
  (root, close) => {
    root.querySelector("#edit")?.addEventListener("click", () => { close(); openForm(e); });
    root.querySelector("#ics").addEventListener("click", () => downloadIcs([e], `${label(e)}.ics`));
    root.querySelector("#cpy").addEventListener("click", () => copyText(`[ICTC 함께] ${label(e)}\n${rangeText(e)}${e.place ? "\n장소: " + e.place : ""}${e.memo ? "\n" + e.memo : ""}`));
    root.querySelector("#dup")?.addEventListener("click", () => { close(); const { id, seriesId, ...rest } = e; openForm(null, e.start, { ...rest, ownerName: "" }); });
    root.querySelector("#del")?.addEventListener("click", async () => {
      const series = e.seriesId ? sortEv(S.events.filter(x => x.seriesId === e.seriesId)) : [];
      let targets = [e];
      if (series.length > 1){
        const after = series.filter(x => x.start >= e.start);
        const pickN = await choose(`'${label(e)}' 반복 일정`, [["이 일정만", 1], [`이 날 이후 모두 (${after.length}건)`, 2], [`전체 (${series.length}건)`, 3]]);
        if (!pickN) return;
        targets = pickN === 1 ? [e] : pickN === 2 ? after : series;
      } else if (!confirm(`'${label(e)}' 일정을 삭제할까요?`)) return;
      try {
        await store.deleteMany(targets.map(x => x.id)); close();
        toast(`삭제했습니다${targets.length > 1 ? ` (${targets.length}건)` : ""}.`, { label:"되돌리기", fn: async () => { try { await store.saveMany(targets); toast("되돌렸습니다."); } catch(err){ toast("되돌리지 못했습니다."); } } });
      } catch(err){ console.error(err); toast("삭제하지 못했습니다. 권한을 확인하세요."); }
    });
  });
}

function openForm(e, day, preset){
  const isNew = !e;
  const v = e ? { ...e } : { cat:"trip", half:"full", person: S.person || S.me.name, place:"", title:"", memo:"", ...(preset || {}), start: day || S.sel, end: preset?.end || day || S.sel };
  if (!isAdmin() && !PERSONAL.includes(v.cat)) v.cat = "trip";
  const cats = isAdmin() ? ["trip","leave","edu","eval","etc"] : ["trip","leave","etc"];
  const names = [...new Set([S.me.name, ...S.events.map(x => x.person)].filter(Boolean))].sort();
  sheet(`<h3>${isNew ? "일정 등록" : "일정 수정"}<button class="x" data-close aria-label="닫기">✕</button></h3>
    <div class="f"><span class="lbl">분류</span><div class="picks" id="fCat">${cats.map(c => `<button type="button" class="pick" data-v="${c}" aria-pressed="${v.cat===c}">${CATS[c]}</button>`).join("")}</div></div>
    <div class="f" id="wPerson"><label for="fPerson">누가</label><input id="fPerson" list="names" value="${esc(v.person)}" maxlength="20" placeholder="이름"><datalist id="names">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist></div>
    <div class="f" id="wKind"><span class="lbl">휴가 종별</span><div class="picks" id="fKind">${KINDS.map(k => `<button type="button" class="pick plain" data-v="${k}" aria-pressed="${(v.kind || "연가") === k}">${k}</button>`).join("")}</div></div>
    <div class="two">
      <div class="f"><label for="fStart" id="lStart">시작일</label><input id="fStart" type="date" value="${v.start}"></div>
      <div class="f"><label for="fEnd" id="lEnd">종료일</label><input id="fEnd" type="date" value="${v.end}"></div>
    </div>
    <div class="quick" id="fQuick" style="margin:-6px 0 14px"><button type="button" data-n="0">하루</button><button type="button" data-n="1">2일</button><button type="button" data-n="2">3일</button><button type="button" data-n="4">5일(월~금)</button></div>
    <div class="finfo" id="fInfo" aria-live="polite"></div>
    <div class="f" id="wHalf"><span class="lbl">사용시간</span><div class="picks" id="fHalf">${Object.entries(HALF).map(([k,t]) => `<button type="button" class="pick plain" data-v="${k}" aria-pressed="${(v.half||"full")===k}">${t}</button>`).join("")}</div></div>
    <div class="f" id="wPlace"><label for="fPlace">어디로</label><input id="fPlace" value="${esc(v.place)}" maxlength="40" placeholder="예: 경남소방본부, 중앙소방학교">
      <div class="quick">${["경남","울산","창원","중앙소방학교","소방청"].map(p=>`<button type="button" data-place="${p}">${p}</button>`).join("")}</div></div>
    <div class="f" id="wTitle"><label for="fTitle" id="lTitle">내용</label><input id="fTitle" value="${esc(v.title)}" maxlength="60"></div>
    <div class="f" id="wTime"><span class="lbl">시간</span>
      <div class="picks" id="fTmode"><button type="button" class="pick plain" data-v="all" aria-pressed="${!v.time}">종일</button><button type="button" class="pick plain" data-v="time" aria-pressed="${!!v.time}">시간 지정</button></div>
      <div class="tbox ${v.time ? "" : "hide"}" id="fTbox">
        <div class="tlbl">시작</div>
        <div class="tchips" id="fHours">${Array.from({ length: 15 }, (_, k) => k + 7).map(h => `<button type="button" data-h="${h}">${h}시</button>`).join("")}</div>
        <div class="tchips" id="fMins" style="margin-top:6px">${["00","10","20","30","40","50"].map(m => `<button type="button" data-m="${m}">:${m}</button>`).join("")}</div>
        <div class="tlbl">얼마나</div>
        <div class="tchips" id="fDurs">${[[30,"30분"],[60,"1시간"],[90,"1시간 30분"],[120,"2시간"],[180,"3시간"],[240,"4시간"],["18:00","18시까지"]].map(([d, x]) => `<button type="button" data-d="${d}">${x}</button>`).join("")}</div>
        <div class="trange"><input id="fTime" type="time" step="600" value="${esc(v.time || "")}" aria-label="시작 시간"><span>~</span><input id="fTimeEnd" type="time" step="600" value="${esc(v.timeEnd || "")}" aria-label="끝 시간"><b id="fTlen"></b></div>
      </div></div>
    <div class="f" id="wReason"><label for="fReason">사유 (선택)</label><input id="fReason" value="${esc(v.reason || "")}" maxlength="80" placeholder="예: 개인 용무, 병원 진료, 자녀 학교 행사">
      <p class="hint">사유는 직원 모두에게 보입니다. 필요한 만큼만 적어 주세요.</p></div>
    <div class="f" id="wStaff"><label for="fStaff">담당 교관 (선택)</label><input id="fStaff" value="${esc(staffOf(v).join(", "))}" placeholder="이름을 쉼표로 구분 (예: 김기석, 이도경)">
      <div class="quick" id="fStaffQ">${people().map(n => `<button type="button" data-staff="${esc(n)}">${esc(n)}</button>`).join("")}</div></div>
    <label class="f" id="wPlan" style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="fPlan" ${v.plan ? "checked" : ""} style="width:18px;height:18px"> 확정 전 계획(안)으로 표시</label>
    ${isNew ? `<div class="f" id="wRep"><span class="lbl">반복</span><div class="picks" id="fRep">${[["none","안 함"],["w1","매주"],["w2","격주"],["m1","매월"]].map(([k,t]) => `<button type="button" class="pick plain" data-v="${k}" aria-pressed="${k==="none"}">${t}</button>`).join("")}</div>
      <div id="fRepEndW" class="hide" style="margin-top:8px"><label for="fRepEnd" style="font-size:12.5px;font-weight:600;color:var(--ink2)">반복 끝나는 날</label><input id="fRepEnd" type="date"></div></div>` : ""}
    <div class="f"><label for="fMemo">메모 (선택)</label><textarea id="fMemo" maxlength="300" placeholder="함께 알아야 할 내용만 적어 주세요.">${esc(v.memo)}</textarea></div>
    <div class="actions"><button class="btn btn-line" data-close>취소</button><button class="btn btn-fire grow" id="fSave">${isNew ? "등록" : "저장"}</button></div>`,
  (root, close) => {
    const q = s => root.querySelector(s);
    const sync = () => {
      const c = v.cat, personal = c === "trip" || c === "leave";
      q("#wPerson").classList.toggle("hide", !(personal || c === "etc"));
      q("#wHalf").classList.toggle("hide", c !== "leave");
      q("#wPlace").classList.toggle("hide", !(c === "trip" || c === "edu" || c === "eval" || c === "etc"));
      q("#lTitle").textContent = personal ? "내용 (선택)" : (c === "etc" ? "무엇을" : "과정명");
      q("#fTitle").placeholder = c === "trip" ? "예: 팀단위 전술훈련 지원" : c === "leave" ? "사유는 적지 않아도 됩니다" : c === "etc" ? "예: 센터 회의, 장비 점검" : "예: 7기 초급현장지휘관 양성과정";
      q("#fEnd").disabled = c === "leave" && v.half !== "full";
      q("#wKind").classList.toggle("hide", c !== "leave");
      q("#wReason").classList.toggle("hide", c !== "leave");
      q("#wTitle").classList.toggle("hide", c === "leave");
      q("#wRep")?.classList.toggle("hide", c === "leave");
      q("#lStart").textContent = c === "leave" ? "사용기간 (시작)" : "시작일";
      q("#lEnd").textContent = c === "leave" ? "사용기간 (끝)" : "종료일";
      const course = c === "edu" || c === "eval";
      q("#wStaff").classList.toggle("hide", !course); q("#wPlan").classList.toggle("hide", !course);
      const tLeave = c === "leave" && v.half === "time";
      q("#wTime").classList.toggle("hide", c === "leave" && !tLeave);
      q("#fTmode").classList.toggle("hide", tLeave);
      if (tLeave && typeof tmode !== "undefined"){
        tmode = "time"; q("#fTbox").classList.remove("hide");
        q("#fTmode").querySelectorAll(".pick").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === "time"));
        if (!q("#fTime").value){ q("#fTime").value = "09:00"; q("#fTimeEnd").value = "11:00"; }
        tPaint();
      }
    };
    // 시간: 시 → 분 → 얼마나 세 번이면 끝
    let tmode = v.time ? "time" : "all";
    const tPaint = () => {
      const s = q("#fTime").value, en = q("#fTimeEnd").value, sm = toMin(s);
      q("#fHours").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", !!s && +b.dataset.h === Math.floor(sm / 60)));
      q("#fMins").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", !!s && +b.dataset.m === sm % 60));
      const len = s && en ? toMin(en) - sm : null;
      q("#fDurs").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", len !== null && (b.dataset.d.includes(":") ? en === b.dataset.d : +b.dataset.d === len)));
      q("#fTlen").textContent = len === null ? "" : len > 0 ? `${len >= 60 ? Math.floor(len / 60) + "시간" : ""}${len % 60 ? " " + (len % 60) + "분" : ""}`.trim() : (q("#fEnd").value > q("#fStart").value ? "다음 날까지" : "끝 시간을 확인해 주세요");
    };
    const curLen = () => { const s = q("#fTime").value, en = q("#fTimeEnd").value; const l = s && en ? toMin(en) - toMin(s) : 60; return l > 0 ? l : 60; };
    const setStart = m => { const l = curLen(); q("#fTime").value = fromMin(m); q("#fTimeEnd").value = fromMin(m + l); tPaint(); };
    q("#fTmode").addEventListener("click", ev => {
      const b = ev.target.closest(".pick"); if (!b) return; tmode = b.dataset.v;
      q("#fTmode").querySelectorAll(".pick").forEach(x => x.setAttribute("aria-pressed", x === b));
      q("#fTbox").classList.toggle("hide", tmode !== "time");
      if (tmode === "time" && !q("#fTime").value){ q("#fTime").value = "09:00"; q("#fTimeEnd").value = "10:00"; }
      tPaint();
    });
    q("#fHours").addEventListener("click", ev => { const b = ev.target.closest("[data-h]"); if (!b) return; setStart(+b.dataset.h * 60 + (q("#fTime").value ? toMin(q("#fTime").value) % 60 : 0)); });
    q("#fMins").addEventListener("click", ev => { const b = ev.target.closest("[data-m]"); if (!b) return; const h = q("#fTime").value ? Math.floor(toMin(q("#fTime").value) / 60) : 9; setStart(h * 60 + +b.dataset.m); });
    q("#fDurs").addEventListener("click", ev => {
      const b = ev.target.closest("[data-d]"); if (!b) return;
      if (!q("#fTime").value) q("#fTime").value = "09:00";
      q("#fTimeEnd").value = b.dataset.d.includes(":") ? b.dataset.d : fromMin(toMin(q("#fTime").value) + +b.dataset.d); tPaint();
    });
    ["#fTime", "#fTimeEnd"].forEach(s => q(s).addEventListener("input", tPaint));
    tPaint();
    root.querySelectorAll("[data-staff]").forEach(b => b.addEventListener("click", () => {
      const cur = q("#fStaff").value.split(/[,·\s]+/).map(s => s.trim()).filter(Boolean), n = b.dataset.staff;
      q("#fStaff").value = (cur.includes(n) ? cur.filter(x => x !== n) : [...cur, n]).join(", ");
    }));
    q("#fCat").addEventListener("click", ev => { const b = ev.target.closest(".pick"); if (!b) return; v.cat = b.dataset.v; q("#fCat").querySelectorAll(".pick").forEach(x => x.setAttribute("aria-pressed", x === b)); sync(); });
    v.kind = v.kind || "연가";
    q("#fKind").addEventListener("click", ev => {
      const b = ev.target.closest(".pick"); if (!b) return; v.kind = b.dataset.v;
      q("#fKind").querySelectorAll(".pick").forEach(x => x.setAttribute("aria-pressed", x === b));
      const pre = KIND_PRESET[v.kind];
      if (pre){
        v.half = "time"; q("#fHalf").querySelectorAll(".pick").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === "time"));
        q("#fEnd").value = q("#fStart").value; q("#fTime").value = pre[0]; q("#fTimeEnd").value = pre[1];
      } else if (v.half === "time"){
        v.half = "full"; q("#fHalf").querySelectorAll(".pick").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === "full"));
      }
      sync(); info();
    });
    q("#fHalf").addEventListener("click", ev => { const b = ev.target.closest(".pick"); if (!b) return; v.half = b.dataset.v; q("#fHalf").querySelectorAll(".pick").forEach(x => x.setAttribute("aria-pressed", x === b)); if (v.half !== "full") q("#fEnd").value = q("#fStart").value; sync(); });
    q("#fQuick").addEventListener("click", ev => { const n = ev.target.dataset.n; if (n == null) return; q("#fEnd").value = ymd(addDays(pd(q("#fStart").value), +n)); });
    root.querySelectorAll("[data-place]").forEach(b => b.addEventListener("click", () => { q("#fPlace").value = b.dataset.place; }));
    q("#fStart").addEventListener("change", () => { if (q("#fEnd").value < q("#fStart").value || (v.cat==="leave" && v.half!=="full")) q("#fEnd").value = q("#fStart").value; info(); });
    // 같은 기간 교육·부재 안내
    const info = () => {
      const s = q("#fStart").value, en = q("#fEnd").value || s, who = q("#fPerson").value.trim();
      if (!s) { q("#fInfo").innerHTML = ""; return; }
      const over = S.events.filter(x => x.id !== e?.id && x.start <= en && x.end >= s);
      const crs = [...new Set(sortEv(over.filter(x => x.cat === "edu" || x.cat === "eval")).map(x => x.title))];
      const away = sortEv(over.filter(x => (x.cat === "trip" || x.cat === "leave") && x.person));
      const same = (v.cat === "trip" || v.cat === "leave") && who ? away.filter(x => x.person === who) : [];
      const others = away.filter(x => x.person !== who);
      const fmt = x => `${esc(x.person)} ${x.cat === "trip" ? "출장" : (leaveText(x) + (x.half === "time" ? " " + timeText(x) : ""))} ${md(x.start)}${x.end !== x.start ? "~" + md(x.end) : ""}`;
      q("#fInfo").innerHTML = [
        same.length && `<div class="warn">⚠ ${esc(who)} 님은 이 기간에 이미 ${same.map(x => fmt(x).replace(x.person + " ", "")).join(", ")} 일정이 있습니다.</div>`,
        crs.length && `<div><b>진행 교육</b> ${crs.slice(0,4).map(esc).join(", ")}${crs.length > 4 ? ` 외 ${crs.length-4}` : ""}</div>`,
        others.length && `<div><b>같은 기간 부재 ${new Set(others.map(x => x.person)).size}명</b> ${others.slice(0,5).map(fmt).join(", ")}${others.length > 5 ? " …" : ""}</div>`
      ].filter(Boolean).join("");
    };
    ["#fEnd","#fPerson"].forEach(s => q(s).addEventListener("input", info));
    q("#fQuick").addEventListener("click", info);
    let rep = "none";
    q("#fRep")?.addEventListener("click", ev => {
      const b = ev.target.closest(".pick"); if (!b) return; rep = b.dataset.v;
      q("#fRep").querySelectorAll(".pick").forEach(x => x.setAttribute("aria-pressed", x === b));
      q("#fRepEndW").classList.toggle("hide", rep === "none");
      if (rep !== "none" && !q("#fRepEnd").value) q("#fRepEnd").value = ymd(addDays(pd(q("#fStart").value), 90));
    });
    sync(); info();
    q("#fSave").addEventListener("click", async () => {
      const ev = {
        ...(e || {}), id: e?.id || ("e" + Date.now().toString(36) + Math.random().toString(36).slice(2,6)),
        cat: v.cat, start: q("#fStart").value, end: q("#fEnd").value || q("#fStart").value,
        half: v.cat === "leave" ? v.half : "full",
        person: q("#fPerson").value.trim(), place: q("#fPlace").value.trim(), title: v.cat === "leave" ? "" : q("#fTitle").value.trim(), memo: q("#fMemo").value.trim(),
        kind: v.cat === "leave" ? (v.kind || "연가") : "", reason: v.cat === "leave" ? q("#fReason").value.trim() : "",
        plan: (v.cat === "edu" || v.cat === "eval") ? q("#fPlan").checked : false,
        time: (v.cat === "leave" && v.half !== "time") || tmode !== "time" ? "" : q("#fTime").value,
        timeEnd: (v.cat === "leave" && v.half !== "time") || tmode !== "time" ? "" : q("#fTimeEnd").value,
        staff: (v.cat === "edu" || v.cat === "eval") ? [...new Set(q("#fStaff").value.split(/[,·\s]+/).map(s => s.trim()).filter(Boolean))].slice(0, 12) : [],
        ownerName: e?.ownerName || S.me.name, editedBy: S.me.name, updatedAt: new Date().toISOString()
      };
      if (ev.cat === "leave" && ev.half !== "full") ev.end = ev.start;
      if (!ev.start) return toast("시작일을 골라 주세요.");
      if (ev.end < ev.start) return toast("종료일이 시작일보다 빠릅니다.");
      if (ev.time && ev.timeEnd && ev.start === ev.end && toMin(ev.timeEnd) <= toMin(ev.time)) return toast("끝 시간이 시작 시간보다 늦어야 합니다.");
      if (tmode === "time" && !ev.time && (v.cat !== "leave" || v.half === "time")) return toast("시작 시간을 골라 주세요.");
      if (ev.cat === "leave" && ev.half === "time" && (!ev.time || !ev.timeEnd)) return toast("휴가 시작·끝 시간을 골라 주세요.");
      if ((ev.cat === "trip" || ev.cat === "leave") && !ev.person) return toast("누구의 일정인지 이름을 적어 주세요.");
      if ((ev.cat === "edu" || ev.cat === "eval" || ev.cat === "etc") && !ev.title) return toast(v.cat === "etc" ? "무엇을 하는지 적어 주세요." : "과정명을 적어 주세요.");
      let list = [ev];
      if (isNew && rep !== "none" && v.cat !== "leave"){
        const until = q("#fRepEnd").value;
        if (!until || until < ev.start) return toast("반복 끝나는 날을 확인해 주세요.");
        const len = diff(ev.start, ev.end), sid = "r" + Date.now().toString(36);
        list = [];
        for (let k = 0; k < 60; k++){
          let s;
          if (rep === "m1"){ const b = pd(ev.start), d = new Date(b.getFullYear(), b.getMonth() + k, b.getDate(), 12); if (d.getDate() !== b.getDate()) continue; s = ymd(d); }
          else s = ymd(addDays(pd(ev.start), k * (rep === "w2" ? 14 : 7)));
          if (s > until) break;
          list.push({ ...ev, id: ev.id + "-" + k, seriesId: sid, start: s, end: ymd(addDays(pd(s), len)) });
        }
        if (list.length > 1 && !confirm(`반복 일정 ${list.length}건을 등록할까요?`)) return;
      }
      try {
        q("#fSave").disabled = true;
        await (list.length > 1 ? store.saveMany(list) : store.saveEvent(ev)); close();
        S.sel = ev.start; S.month = pd(ev.start.slice(0,8)+"01"); render();
        toast(isNew ? `등록했습니다${list.length > 1 ? ` (${list.length}건)` : ""}.${S.mode === "demo" ? "" : " 직원 모두에게 보입니다."}` : "저장했습니다.");
      } catch(err){ console.error(err); q("#fSave").disabled = false; toast(isAdmin() || PERSONAL.includes(ev.cat) ? "저장하지 못했습니다. 다시 로그인해 주세요." : "교육·평가는 관리자 모드에서 저장할 수 있습니다."); }
    });
  });
}

function pwFields(id, label, numeric){
  const im = numeric ? ` inputmode="numeric" pattern="[0-9]*" placeholder="숫자 4자리 이상"` : ` placeholder="${MIN_PW}자 이상"`;
  return `<div class="two"><div class="f"><label for="${id}">${label}</label><input id="${id}" type="password" autocomplete="new-password" maxlength="64"${im}></div>
    <div class="f"><label for="${id}2">한 번 더</label><input id="${id}2" type="password" autocomplete="new-password" maxlength="64"${im}></div></div>`;
}
// fmt: "pin"(숫자 4자리 이상) | "text"(8자 이상)
function readPw(root, id, fmt, optional){
  const a = root.querySelector("#"+id).value, b = root.querySelector("#"+id+"2").value;
  if (optional && !a && !b) return "";
  if (fmt === "pin" && !/^\d{4,12}$/.test(a)) { toast("숫자 4자리 이상으로 정해 주세요."); return null; }
  if (fmt === "text" && a.length < MIN_PW) { toast(`${MIN_PW}자 이상으로 정해 주세요.`); return null; }
  if (a !== b) { toast("두 칸의 비밀번호가 다릅니다."); return null; }
  return a;
}
const accessMode = () => S.access.open ? "open" : (S.access.numeric ? "pin" : "text");
const MODE_TEXT = { open:"비밀번호 없이", pin:"숫자 4자리", text:`${MIN_PW}자 이상` };

  (root, close) => {
    let focus = null;

      const r = root.querySelector(`.crow[data-id="${id}"]`);
      r.querySelector(".cprev").style.setProperty("--c", draft[id]);
      r.querySelector("input").value = draft[id];
      r.querySelector("[data-reset]").disabled = draft[id].toLowerCase() === DEFAULT_COLORS[id];
    };
    root.querySelectorAll(".crow").forEach(r => {

      r.querySelector("input").addEventListener("input", ev => { draft[id] = ev.target.value; paint(id); });

    });
    root.querySelectorAll("[data-sw]").forEach(b => b.addEventListener("click", () => {

  S.mode = "demo"; await local.init();
  S.access = local.data.access;
  const ok = local.data.session && (S.access.open || local.data.session === local.data.k);
  if (ok && myName()) enterDemo(); else showLogin();
}

/* --- 공유 모드 --- */
let unsubs = [];
async function enterShared(){
  const { fs, db, authObj } = S.fb, uid = authObj.currentUser.uid;
  unsubs.forEach(u => u()); unsubs = [];
  S.me = { name: myName() };
  try { const a = await fs.getDoc(fs.doc(db, "adminSessions", uid)); S.adminUntil = a.exists() ? a.data().exp.toMillis() : 0; } catch(e){ S.adminUntil = 0; }
  await new Promise((resolve, reject) => {
    let first = true;
    unsubs.push(fs.onSnapshot(fs.collection(db, "notices"), snap => {
      S.notices = snap.docs.map(d => ({ ...d.data(), id: d.id })); if (!first) render();
    }, err => console.warn("공지를 불러오지 못했습니다(보안 규칙 확인)", err)));
    unsubs.push(fs.onSnapshot(fs.doc(db, "settings", "colors"), d => {
      S.colors = d.exists() ? (d.data().c || {}) : {}; if (!first) render();
    }, err => console.warn(err)));
    unsubs.push(fs.onSnapshot(fs.collection(db, "events"), snap => {
      S.events = snap.docs.map(d => ({ half:"full", ...d.data(), id: d.id }));
      if (first){ first = false; showApp(); resolve(); } else render();
    }, err => {
      unsubs.forEach(u => u()); unsubs = [];
      if (first){ first = false; reject(err); }
      else store.getAccess().then(a => { S.access = a; showLogin("접속 방식이나 공용 비밀번호가 바뀌었습니다. 다시 들어와 주세요."); });
    }));
  });
}
async function startShared(){
  showGate(`<h1>ICTC <em>함께</em></h1><p>연결하는 중…</p>`);
  const v = "10.12.2";
  const [appM, auth, fs] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`)
  ]);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  const authObj = auth.getAuth(app);
  let db;
  try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch(e){ console.warn("오프라인 저장 없이 진행", e); db = fs.getFirestore(app); }
  S.mode = "shared"; S.fb = { fs, db, auth, authObj };
  await authObj.authStateReady();
  S.access = await store.getAccess();
  if (authObj.currentUser && myName()){
    try { await enterShared(); return; } catch(e){ /* 세션 없음 또는 비밀번호 변경됨 */ }
  }
  showLogin();
}

/* --- 관리자 모드 시간 끝나면 화면 갱신 --- */
setInterval(() => { if (S.me && S.adminUntil && !isAdmin()){ S.adminUntil = 0; render(); toast("관리자 모드가 꺼졌습니다."); } }, 30e3);

/* --- 처음 한 번: 비밀번호 지문 만들기 (주소 끝에 ?setup) --- */
function showSetup(){
  showGate(`<h1>처음 설정</h1>
    <p>직원 공용 비밀번호와 관리자 비밀번호를 정하면, Firebase에 넣을 지문(해시)을 만들어 드립니다. 비밀번호 원문은 어디에도 저장되지 않습니다.</p>
    <form id="sForm" style="text-align:left">
      <div class="f"><label for="sStaff">직원 공용 비밀번호 (숫자 4자리 이상 또는 ${MIN_PW}자 이상)</label><input id="sStaff" type="password" autocomplete="new-password"></div>
      <div class="f"><label for="sAdmin">관리자 비밀번호 (${MIN_PW}자 이상, 공용과 다르게)</label><input id="sAdmin" type="password" autocomplete="new-password"></div>
      <button class="btn btn-ink">지문 만들기</button>
    </form><div id="sOut" style="text-align:left;margin-top:16px"></div>`);
  if (!FIREBASE_CONFIG.projectId) $("sOut").innerHTML = `<p class="hint" style="color:var(--fire)">먼저 index.html의 FIREBASE_CONFIG를 채워 주세요. 프로젝트마다 지문이 달라집니다.</p>`;
  $("sForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const s = $("sStaff").value, a = $("sAdmin").value;
    if (!(/^\d{4,12}$/.test(s) || s.length >= MIN_PW)) return toast(`공용 비밀번호는 숫자 4자리 이상 또는 ${MIN_PW}자 이상으로 정해 주세요.`);
    if (a.length < MIN_PW) return toast(`관리자 비밀번호는 ${MIN_PW}자 이상으로 정해 주세요.`);
    if (s === a) return toast("공용 비밀번호와 관리자 비밀번호는 서로 달라야 합니다.");
    const [k, ak] = await Promise.all([pwKey(s, "staff"), pwKey(a, "admin")]);
    const row = (col, id) => `<div class="f"><span class="lbl">컬렉션 <b>${col}</b> → 문서 ID</span><code style="text-align:left">${id}</code>
      <button type="button" class="btn btn-line btn-sm" data-cp="${id}">복사</button></div>`;
    $("sOut").innerHTML = `<p class="hint">Firebase 콘솔 → Firestore Database → 데이터 → <b>컬렉션 시작</b>으로 아래 두 문서를 만드세요. 필드는 아무거나 하나(예: memo / 문자열 / 처음)면 됩니다.</p>
      ${row("keys", k)}${row("adminKeys", ak)}
      <p class="hint">만든 뒤에는 주소 끝의 ?setup 을 지우고 들어가면 됩니다. 이후 비밀번호 변경은 앱의 관리자 모드에서 합니다.</p>`;
    $("sOut").querySelectorAll("[data-cp]").forEach(b => b.addEventListener("click", () => { navigator.clipboard?.writeText(b.dataset.cp); toast("복사했습니다."); }));
  });
}

/* 고정 이벤트 연결 */
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
$("mPrev").addEventListener("click", () => shift(-1));
$("mNext").addEventListener("click", () => shift(1));
$("wPrev").addEventListener("click", () => shift(-1));
$("wNext").addEventListener("click", () => shift(1));
$("wToday").addEventListener("click", goToday);
$("wWeekend").addEventListener("click", () => { S.weekend = !S.weekend; renderWeek(); });
$("mTitle").addEventListener("click", () => { const j = $("mJump"); try { j.showPicker(); } catch(e){ setView("year"); } });
$("mJump").addEventListener("change", e => { if (!e.target.value) return; S.month = pd(e.target.value + "-01"); renderMonth(); renderLegend(); });
swipe($("weeks")); swipe($("wGrid")); swipe($("yearGrid"));
document.addEventListener("keydown", e => {
  if (!S.me || $("sheetRoot").innerHTML || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) return;
  const k = e.key;
  if (k === "ArrowLeft") shift(-1); else if (k === "ArrowRight") shift(1);
  else if (k === "t" || k === "T" || k === "ㅅ") goToday();
  else if (k === "n" || k === "N" || k === "ㅜ") { e.preventDefault(); openForm(null, S.sel); }
  else if ("12345".includes(k) && k.length === 1) setView(["home","week","month","year","list"][+k - 1]);
  else if (k === "/") { e.preventDefault(); setView("list"); $("q").focus(); }
  else return;
});
$("mToday").addEventListener("click", goToday);
$("yPrev").addEventListener("click", () => shift(-1));
$("yNext").addEventListener("click", () => shift(1));
$("q").addEventListener("input", e => { S.q = e.target.value; renderList(); });
document.querySelectorAll("[data-range]").forEach(b => b.addEventListener("click", () => {
  S.range = b.dataset.range; document.querySelectorAll("[data-range]").forEach(x => x.setAttribute("aria-pressed", x === b)); renderList();
}));
$("copyWeek").addEventListener("click", async () => {
  const t = weekText();
  try { await navigator.clipboard.writeText(t); toast("이번 주 일정을 복사했습니다. 단톡방에 붙여 넣으세요."); }
  catch(e){ sheet(`<h3>이번 주 일정<button class="x" data-close>✕</button></h3><textarea style="width:100%;min-height:260px;border:1px solid var(--line);border-radius:10px;padding:10px">${esc(t)}</textarea>`); }
});
$("mPrint").addEventListener("click", () => printView("month"));
$("wPrint").addEventListener("click", () => printView("week"));
$("csv").addEventListener("click", exportCsv);
$("logo").addEventListener("click", () => { if (S.me) setView("home"); });
$("fab").addEventListener("click", () => openForm(null, S.sel));

const configured = FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId;
if (new URLSearchParams(location.search).has("setup")) showSetup();
else if (configured) startShared().catch(e => { console.error(e); showGate(`<h1>연결하지 못했습니다</h1><p>인터넷 연결을 확인하고 새로고침해 주세요.</p>`); });
else startDemo();
</script>
</body>
</html>
